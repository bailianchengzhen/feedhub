org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# 几个 agent 会在各自的 worktree 里同时构建：Kotlin 编译放进 Gradle 进程里（不再单开 Kotlin daemon），
# daemon 空闲 10 分钟就退出，免得一直占内存
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon.idletimeout=600000
kotlin.code.style=official
# 见 app/build.gradle.kts），
# 它带两条显式 `dependsOn`，默认层级模板因此整份不会应用、每次构建都打一条告警。这里显式关掉模板：
# 本项目只有 :app 是 KMP，且模板本来也没给 :app 建出 jvmMain 那几条边，关掉不改变任何源集的可见性。
kotlin.mpp.applyDefaultHierarchyTemplate=false
