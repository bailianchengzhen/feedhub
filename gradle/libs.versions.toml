[versions]
kotlin = "2.3.21"
coroutines = "1.10.2"
serialization = "1.9.0"
okhttp = "4.12.0"
clikt = "5.0.3"
wire = "7.0.4"
jbcrypt = "0.4"
vlcj = "4.12.1"
gst1-java-core = "1.4.0"
jsoup = "1.18.3"
compose = "1.12.1"
compose-material3 = "1.9.0"
coil = "3.6.3"
zxing = "3.5.3"
androidx-sqlite = "2.7.1"
# 跨设备同步的设备密钥（X25519）：安卓 minSdk 26 上没有平台自带的 X25519（XDH / NamedParameterSpec 要到 API 33，
# Conscrypt 的 JCA X25519 更晚），所以两端都用 BouncyCastle 的 lightweight API（不注册 JCA provider、不改全局）。
# MIT 许可，jdk18on = Java 8+（安卓 API 26 能用）。
bouncycastle = "1.80.2"
# JCEF（内嵌 Chromium）：只给「网页登录 / 平台强制的人机验证」用，Apache-2.0。
# 本地库 ~1MB；CEF 原生包（~100MB）由 jcefmaven 第一次运行时下载到 ~/.cache/feedhub/jcef，不打进 deb。
jcefmaven = "135.0.20"
# JNA：UniFFI 生成的 Kotlin 绑定靠它加载 .so。桌面已经有（vlcj 带的 jna-jpms 5.16.0），
# 安卓要单独的 aar（里面带各 ABI 的 libjnidispatch.so）。5.17.0 是 2025 的稳定版。
jna = "5.17.0"
# n/sig（EJS）跑在 JVM 上的 QuickJS 绑定，Apache-2.0。钉 1.0.5：1.0.6 起用 Kotlin 2.4 编译（本仓库是 2.3.21），
quickjs = "1.0.5"
# 语言识别（本地）：lingua 1.2.2，Apache-2.0，纯 JVM。桌面翻译用它判断"整条内容是中文还是外语"。
# 完整 jar ~80MB（带 75 种语言的模型）；只用中文+英文两个模型时内存约 60MB。
lingua = "1.2.2"
# 安卓：AGP 9 起 KMP 模块不能再配 com.android.application，共享代码走
# com.android.kotlin.multiplatform.library，APK 外壳单独一个 :androidApp。
# 见 https://www.jetbrains.com/help/kotlin-multiplatform-dev/multiplatform-project-agp-9-migration.html
agp = "9.4.0"
androidx-activity = "1.12.4"
# compileSdk 37（本机装的是 platforms/android-37.0，AGP 9.4 认这个带小版本号的目录名）
# + build-tools 37.0.0（显式钉住，别让 AGP 自己去下新的）。Compose 1.12.1 / Coil 3.6.3 的安卓 AAR
# 自带 minCompileSdk=37，compileSdk 必须 ≥ 37。
android-compile-sdk = "37"
android-min-sdk = "26"
# targetSdk 先留在 36：自用 App，跟着平台升会引入新的行为变更（例如更严的后台 / 权限 / 边到边强制），
# 而平板是 Android 16（SDK 36）；等哪天要用 37 的行为再升。
android-target-sdk = "36"
android-build-tools = "37.0.0"
# 安卓播放器：Media3 ExoPlayer（Jetpack 版的 ExoPlayer）。
# 只取 exoplayer + dash + hls + datasource-okhttp + ui（PlayerView）。datasource-okhttp 让我们
# 直接用平台那一份 OkHttpClient 当数据源（代理 / fail-closed / Referer / UA 都跟着走）。
media3 = "1.11.1"
# 安卓登录 WebView：ProxyController（按平台给 WebView 设代理，fail-closed）+ CookieManagerCompat.getCookieInfo
# （退出登录时精确删掉这个平台的 Cookie：名字 / 域 / 路径都能拿到）。Apache-2.0。
webkit = "1.14.0"
# 「从电脑同步」扫码：CameraX（相机预览 / 帧分析）+ zxing core（已经在用，只再加解码）。
# 不用 Google Play 服务（国行 ROM没有），CameraX 是纯 Jetpack。
camera = "1.6.2"
# CameraX 的 LifecycleCameraController / LocalLifecycleOwner（从 Compose 拿 Activity 的生命周期）
lifecycle = "2.10.0"
# Baseline Profile：profileinstaller 负责"装上 / 升级后把 profile 交给 ART"；
# :baselineprofile 那个 macrobenchmark 模块负责在真机 / 模拟器上跑一遍生成。
# profileinstaller 1.4.1 和本机 gradle 缓存里已有的版本一致。
profileinstaller = "1.4.1"
benchmark = "1.5.0"
androidx-test-junit = "1.3.0"
# instrumented（androidTest）测试的 Runner：`am instrument` 那边要的
# AndroidJUnitRunner 在这个包里；1.7.0 和本机 gradle 缓存里已有的版本一致。
androidx-test-runner = "1.7.0"
uiautomator = "2.3.0"
# 本地向量：ONNX Runtime 的安卓 AAR（Apache-2.0 / MIT）。
# 只用文字模型（EmbeddingGemma 2 q4 + accuracy_level=4 的图），
onnxruntime = "1.31.0"
# 只有 `-Pfeedhub.embedNpu=true` 的构建才引这两个。
# EP 插件是 MIT；qnn-runtime 是 Qualcomm AI Stack License（允许随 App 发目标码，不许单独分发），
qnn-ep = "2.7.0"
qnn-runtime = "2.51.0"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
jbcrypt = { module = "org.mindrot:jbcrypt", version.ref = "jbcrypt" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
vlcj = { module = "uk.co.caprica:vlcj", version.ref = "vlcj" }
gst1-java-core = { module = "org.freedesktop.gstreamer:gst1-java-core", version.ref = "gst1-java-core" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
compose-material-icons = { module = "org.jetbrains.compose.material:material-icons-extended", version = "1.7.3" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
# 设备密钥用的 X25519 / HKDF-SHA256（lightweight API，不注册 JCA provider）
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
jcefmaven = { module = "me.friwi:jcefmaven", version.ref = "jcefmaven" }
wire-runtime = { module = "com.squareup.wire:wire-runtime", version.ref = "wire" }
quickjs-kt = { module = "io.github.dokar3:quickjs-kt", version.ref = "quickjs" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
lingua = { module = "com.github.pemistahl:lingua", version.ref = "lingua" }
# lingua 的运行时依赖：只保留中文/英文模型时手动带上（完整 jar 里模型占 ~78MB）
lingua-fastutil = { module = "it.unimi.dsi:fastutil", version = "8.5.8" }
lingua-moshi = { module = "com.squareup.moshi:moshi", version = "1.13.0" }
lingua-moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version = "1.13.0" }
lingua-kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version = "1.6.0" }
# 安卓的 Activity + Compose 入口（setContent）。Compose 本体由 org.jetbrains.compose 的库带进来。
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
# 安卓播放器（Media3）：核心 + DASH + HLS + OkHttp 数据源 + PlayerView
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
# Baseline Profile：运行时把 profile 装给 ART（manifest 里的 ProfileInstallReceiver 由这个库合并进来）
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
# macrobenchmark 生成器（只有 :baselineprofile 这个测试模块用，不进 APK）
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
# 本地向量：ONNX Runtime 的安卓 AAR（含 arm64-v8a / x86_64 等几份 .so；APK 里的 abiFilters 会筛掉不用的）
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
# QNN EP 插件（AAR 里只有 `libonnxruntime_providers_qnn.so`，minSdk 27）——配上面的 ORT 1.31 用
onnxruntime-android-qnn = { module = "com.qualcomm.qti:onnxruntime-android-qnn", version.ref = "qnn-ep" }
# QNN 运行时本体（HTP / System / 各 arch 的 skel+stub；APK 只留 v79 那份，见 androidApp 的 jniLibs excludes）
qnn-runtime = { module = "com.qualcomm.qti:qnn-runtime", version.ref = "qnn-runtime" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
wire = { id = "com.squareup.wire", version.ref = "wire" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
# 只是仪器化测试（macrobenchmark 生成器）的模块类型
# 注：**没有**用 androidx.baselineprofile 插件——1.4.1 / 1.5.0 在 AGP 9.4 上 apply 就崩（TestExtension 类型变了），
android-test = { id = "com.android.test", version.ref = "agp" }
