// 弹幕分段接口 `/x/v2/dm/wbi/web/seg.so` 的响应：不带 gRPC 帧头的裸 protobuf。
//
// 只写了我们读的字段。消息名和 package 沿用 B站 官方客户端里的名字，字段号就是线上响应用的那一套
// （Rust 侧 `bili/danmaku.rs` 按同样的字段号手工解码，两边由对拍测试互相校验）。
// 响应里其余字段 Wire 解码时当未知字段跳过，不影响。
syntax = "proto3";

package bilibili.community.service.dm.v1;

option java_package = "feedhub.source.bilibili.proto";

message DmSegMobileReply {
  repeated DanmakuElem elems = 1;
  // 0 正常，1 这个视频关了弹幕
  int32 state = 2;
}

message DanmakuElem {
  int64 id = 1;
  // 出现时间，毫秒
  int32 progress = 2;
  // 1–3 滚动，4 底部，5 顶部，6 及以上是逆向 / 高级 / 代码类，我们不显示
  int32 mode = 3;
  // 25 是标准字号，18 是小号
  int32 fontsize = 4;
  // 0xRRGGBB
  uint32 color = 5;
  string content = 7;
  // 1–10，用户按"屏蔽等级"过滤时比较它
  int32 weight = 9;
  // id 的字符串形式（大数在 JS 里会丢精度，接口两种都给）
  string id_str = 12;
}
